name: Deploy static HTML to Pages

# 用第三方 peaceiris/actions-gh-pages 取代官方 actions/configure-pages
# （codeload 對該帳號 Pages-related actions 拿不到，但 third-party action 可正常下載）

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write    # peaceiris needs to push to gh-pages branch

# 同一時間只跑一個部署、後到的排隊（不取消）：
# 2026-09-13 兩次 push 相隔數分鐘 → 兩個 run 並行，後者 gh-pages 基底過時 → push rejected (fetch first)。
# 每次部署都是完整快照，排隊後最後一次自然是最新內容。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: '.github,*.py,*.md,*.json'
          keep_files: false
          enable_jekyll: false
